<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم شَادِن</title><meta name="theme-color" content="#090D1A">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#090D1A;--card:#111827;--ln:#2D3748;--tx:#F1F5F9;--mut:#94A3B8;--a:#6875F5;--gold:#E5C07B;--ok:#10b981;--bad:#f43f5e;--deep:linear-gradient(135deg,#1E1B4B,#4C1D95 60%,#5E5CE6)}
*{box-sizing:border-box;margin:0;line-height:1.7}body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 40px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
.gate{min-height:100vh;display:grid;place-items:center;text-align:center;padding:1rem}.gate h1{font-family:'Aref Ruqaa';font-size:2.4rem;color:var(--gold)}
.btn{background:var(--deep);color:#fff;padding:.6rem 1.2rem;border-radius:99px;font-weight:700}.btn.s{padding:.25rem .8rem;font-size:.82rem}.btn.g{background:#1f2937;border:1px solid var(--ln)}.btn.r{background:#7f1d1d}
header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid var(--ln);position:sticky;top:0;background:#090D1Aee;backdrop-filter:blur(10px);z-index:5}
header h1{font-family:'Aref Ruqaa';color:var(--gold);font-size:1.5rem}
nav{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 1rem}nav button{white-space:nowrap;background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:.35rem 1rem}nav button.on{background:var(--deep);border-color:transparent}
nav b{background:var(--bad);border-radius:99px;padding:0 .4rem;font-size:.75rem;margin-inline-start:.3rem}
main{max-width:980px;margin:0 auto;padding:0 1rem}.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:.8rem;margin:.6rem 0;font-size:.92rem}
.field,select,textarea{width:100%;background:#0b1220;border:1px solid var(--ln);border-radius:12px;padding:.55rem .8rem;margin:.2rem 0}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row .n{flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.5rem}.stat{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:.6rem;text-align:center}.stat b{display:block;font-size:1.3rem;color:var(--gold)}
.warn{background:#f43f5e1a;border:1px solid #f43f5e66;color:#fda4af;border-radius:10px;padding:.4rem .7rem;font-weight:700;margin:.3rem 0}
.gold{color:var(--gold)}.mut{color:var(--mut)}a{color:#8B9BDE}.sp{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.sw{width:46px;height:26px;border-radius:99px;background:#374151;position:relative;flex:none}.sw::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ok)}.sw.on::after{right:23px}
img.th{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#1f2937}
.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#1E1B4B;border:1px solid var(--a);padding:.6rem 1.2rem;border-radius:99px;z-index:50;display:none}
</style></head><body>
<div id="gate" class="gate"><div><h1>شَادِن</h1><p class="mut" style="margin:.5rem 0 1rem">لوحة التحكم — للإدارة فقط</p><button class="btn" onclick="login()">الدخول بحساب جوجل</button><p id="gmsg" class="warn" style="display:none;margin-top:1rem"></p></div></div>
<div id="app" style="display:none">
<header><h1>لوحة شَادِن</h1><div class="row n"><a href="index.html" class="btn g s" style="text-decoration:none">المتجر</a><button class="btn g s" onclick="auth.signOut()">خروج</button></div></header>
<nav id="nav"></nav><main id="v"></main></div>
<div id="toast" class="toast"></div>
<script>
firebase.initializeApp({apiKey: "AIzaSyA4dDi0COFZrNiorWTtWwXOKmwXcxn6Jqg",
      authDomain: "shaden2026.firebaseapp.com",
      projectId: "shaden2026",
      storageBucket: "shaden2026.firebasestorage.app",
      messagingSenderId: "773022907386",
      appId: "1:773022907386:web:d2bed39f5d11ae2f438243"});
const auth=firebase.auth(),db=firebase.firestore(),ADMIN='shaaaden806@gmail.com';
const ST=['في انتظار تأكيد الطلب','جاري التجهيز والتغليف','الأوردر مع المندوب','تم الاستلام بنجاح','ملغي'],LEG={'تم استلام الطلب':ST[0],'قيد التجهيز':ST[1],'مع المندوب':ST[2],'تم التسليم':ST[3]},PAY={cod:'الدفع عند الاستلام',vodafone:'فودافون كاش',instapay:'إنستاباي'};
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(Number(n)||0).toLocaleString('en-US');
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};
const S={tab:'orders',orders:[],prods:[],cpn:[],rev:[],ann:{},gen:{},first:true,q:'',sort:'time',st:'all',edit:null,subs:[]};
const TABS=[['orders','الطلبات'],['prods','العطور'],['cpn','الكوبونات'],['rev','التقييمات'],['set','الإعلان والإعدادات']];
async function shHash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('shaden:'+String(s).trim().toUpperCase()));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function login(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{if(e.code==='auth/popup-blocked')auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());else msg('تعذّر الدخول: '+e.code)})}
function msg(t){const g=$('gmsg');g.textContent=t;g.style.display='block'}
auth.onAuthStateChanged(u=>{S.subs.forEach(f=>f());S.subs=[];if(u&&u.email===ADMIN&&u.emailVerified){$('gate').style.display='none';$('app').style.display='block';start()}else{$('app').style.display='none';$('gate').style.display='grid';if(u){msg('هذا الحساب غير مصرّح له بالدخول.');auth.signOut()}}});
function sub(q,f){S.subs.push(q.onSnapshot(f,e=>toast('خطأ في القراءة: '+e.code)))}
function start(){
 sub(db.collection('orders'),s=>{if(!S.first)s.docChanges().forEach(c=>{if(c.type==='added')alertNew(c.doc.data())});S.first=false;S.orders=s.docs.map(d=>d.data());fill()});
 sub(db.collection('perfumes'),s=>{S.prods=s.docs.map(d=>d.data()).sort((a,b)=>a.id-b.id);fill()});
 sub(db.collection('coupons'),s=>{S.cpn=s.docs.map(d=>Object.assign({code:d.id},d.data(),{_id:d.id}));fill()});
 sub(db.collection('reviews'),s=>{S.rev=s.docs.map(d=>Object.assign(d.data(),{_id:d.id}));nav();fill()});
 sub(db.doc('settings/announcement'),d=>{S.ann=d.exists?d.data():{}});
 sub(db.doc('settings/general'),d=>{S.gen=d.exists?d.data():{}});
 nav();view();
}
function alertNew(o){toast('🛍 طلب جديد '+o.orderId);document.title='🛍 طلب جديد!';setTimeout(()=>document.title='لوحة تحكم شَادِن',6000);try{const a=new AudioContext(),g=a.createGain();g.connect(a.destination);[660,880,1100].forEach((f,i)=>{const o=a.createOscillator();o.frequency.value=f;o.connect(g);g.gain.setValueAtTime(.12,a.currentTime+i*.15);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.15+.14);o.start(a.currentTime+i*.15);o.stop(a.currentTime+i*.15+.15)})}catch(e){}}
function nav(){const p=S.rev.filter(r=>r.status==='pending').length;$('nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';nav();view()">${t[1]}${t[0]==='rev'&&p?`<b>${p}</b>`:''}</button>`).join('')}
function view(){const v=$('v'),t=S.tab;
 if(t==='orders')v.innerHTML=`<div id="stt" class="grid" style="margin:.6rem 0"></div><div class="row"><input class="field" placeholder="بحث: كود الفاتورة أو الاسم أو الهاتف" value="${esc(S.q)}" oninput="S.q=this.value;fill()"><select onchange="S.sort=this.value;fill()"><option value="time">الأحدث</option><option value="id">رقم الفاتورة</option><option value="total">المبلغ</option></select><select onchange="S.st=this.value;fill()"><option value="all">كل الحالات</option>${ST.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="row"><button class="btn g s" onclick="exp('o')">تصدير الطلبات (Excel)</button><button class="btn g s" onclick="exp('c')">تصدير العملاء (Excel)</button></div><div id="ol"></div>`;
 if(t==='prods'){const e=S.edit,p=e?S.prods.find(x=>x.id===e)||{}:{},pr=p.prices||{};v.innerHTML=`<div class="card"><b class="gold">${e?'تعديل عطر':'إضافة عطر'}</b><div class="row"><input class="field" id="pf-name" placeholder="اسم العطر" value="${esc(p.name)}"><select id="pf-cat">${[['women','حريمي'],['men','رجالي'],['unisex','مكس'],['bundles','باقات']].map(c=>`<option value="${c[0]}" ${p.category===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div><input class="field" id="pf-desc" placeholder="وصف مختصر بالمصري" value="${esc(p.shortDesc)}"><input class="field" id="pf-scent" placeholder="العائلة العطرية" value="${esc(p.scent)}"><input class="field" id="pf-img" placeholder="رابط الصورة (https://...)" value="${esc(p.image)}"><div class="row"><input class="field" id="pf-p30" type="number" placeholder="سعر 30 مل" value="${pr['30ml']||''}"><input class="field" id="pf-p50" type="number" placeholder="سعر 50 مل" value="${pr['50ml']||''}"><input class="field" id="pf-p100" type="number" placeholder="سعر 100 مل" value="${pr['100ml']||''}"></div><input class="field" id="pf-tag" placeholder="وسم (مثال: جديد)" value="${esc(p.tag)}"><div class="row"><label><input type="checkbox" id="pf-best" ${p.isBestseller?'checked':''}> الأكثر مبيعًا</label><label><input type="checkbox" id="pf-out" ${p.soldOut?'checked':''}> نفدت الكمية</label></div><div class="row"><button class="btn" onclick="saveProd()">حفظ</button>${e?'<button class="btn g" onclick="S.edit=null;view()">إلغاء</button>':''}</div></div><div id="pl"></div>`}
 if(t==='cpn')v.innerHTML=`<div class="card"><b class="gold">كود خصم جديد</b><div class="row"><input class="field" id="cf-code" placeholder="الكود (مثال SHADEN10)"><select id="cf-type"><option value="percent">نسبة %</option><option value="fixed">مبلغ ثابت</option></select><input class="field" id="cf-val" type="number" placeholder="القيمة"></div><div class="row"><label><input type="checkbox" id="cf-on" checked> مفعّل</label><label><input type="checkbox" id="cf-bar"> يظهر في شريط الإعلان</label></div><button class="btn" onclick="saveCpn()">حفظ الكود</button></div><div id="cl"></div>`;
 if(t==='rev')v.innerHTML='<div id="rl"></div>';
 if(t==='set'){const a=S.ann,g=S.gen;v.innerHTML=`<div class="card"><b class="gold">شريط الإعلان</b><label class="row"><input type="checkbox" id="an-on" ${a.enabled?'checked':''} style="flex:none"> تفعيل الشريط</label><input class="field" id="an-text" placeholder="نص الإعلان" value="${esc(a.text)}"><label>اللون <input type="color" id="an-color" value="${esc(a.color||'#4F46E5')}"></label></div><div class="card"><b class="gold">ربط Google Sheets</b><input class="field" id="an-sheet" placeholder="رابط Web App (ينتهي بـ /exec)" value="${esc(g.sheetsUrl)}"><input class="field" id="an-key" type="password" placeholder="مفتاح الأدمن ADMIN_KEY (بيتحفظ على جهازك فقط)" value="${esc(localStorage.getItem('sh_key')||'')}"><p class="mut" style="font-size:.8rem">نفس القيمة اللي حطيتها في Script properties باسم ADMIN_KEY. بيُستخدم لتحديث الحالة في الشيت.</p></div><button class="btn" onclick="saveSet()">حفظ الإعدادات</button>`}
 fill()}
function fill(){const t=S.tab;
 if(t==='orders'&&$('ol')){const c={};S.orders.forEach(o=>{const s=LEG[o.status]||o.status;c[s]=(c[s]||0)+1});const rev=S.orders.filter(o=>(LEG[o.status]||o.status)===ST[3]).reduce((a,o)=>a+(Number(o.payment&&o.payment.total)||0),0);
  $('stt').innerHTML=`<div class="stat"><b>${S.orders.length}</b>كل الطلبات</div>`+ST.map(s=>`<div class="stat"><b>${c[s]||0}</b>${s}</div>`).join('')+`<div class="stat"><b>${money(rev)}</b>مبيعات مستلمة (ج.م)</div>`;
  const q=S.q.trim().toLowerCase(),d=S.sort==='id'?-1:1;let L=S.orders.filter(o=>{const x=o.customer||{};return(S.st==='all'||(LEG[o.status]||o.status)===S.st)&&(!q||[o.orderId,x.name,x.phone,x.altPhone].join(' ').toLowerCase().includes(q))});
  L.sort((a,b)=>S.sort==='total'?(b.payment.total-a.payment.total):S.sort==='id'?String(b.orderId).localeCompare(String(a.orderId)):new Date(b.timestamp)-new Date(a.timestamp));
  $('ol').innerHTML=L.map(o=>{const x=o.customer||{},p=o.payment||{},cur=LEG[o.status]||o.status,ph=String(x.phone||'').replace(/\D/g,'');return`<div class="card"><div class="sp"><b class="gold">#${esc(o.orderId)}</b><span class="mut">${esc(new Date(o.timestamp).toLocaleString('ar-EG'))}</span></div><div><b>${esc(x.name)}</b> — <a href="tel:${esc(ph)}">${esc(x.phone)}</a> · <a target="_blank" rel="noopener" href="https://wa.me/2${esc(ph.replace(/^0/,''))}">واتساب</a>${x.altPhone?' / '+esc(x.altPhone):''}</div><div>${esc(x.governorate)} — ${esc(x.address)}</div><div class="mut">${(o.items||[]).map(i=>esc(i.name)+' ('+esc(i.size)+') ×'+(Number(i.quantity)||0)).join('<br>')}</div>${o.notes?`<div class="warn" style="background:#f59e0b1a;border-color:#f59e0b66;color:#fcd34d"><b>ملاحظات:</b> ${esc(o.notes)}</div>`:''}${x.giftMessage?`<div>🎁 ${esc(x.giftMessage)}</div>`:''}<div>الدفع: <b>${esc(PAY[p.method]||p.method)}</b>${p.method!=='cod'?' ('+esc(p.transactionRef)+')':''} · الإجمالي: <b class="gold">${money(p.total)} ج.م</b></div>${warn(o)}<div class="row" style="margin-top:.4rem">${ST.map((s,i)=>`<button class="btn s ${cur===s?'':'g'}" data-id="${esc(o.orderId)}" data-i="${i}" onclick="setSt(this.dataset.id,+this.dataset.i)">${s}</button>`).join('')}</div></div>`}).join('')||'<p class="mut">لا توجد طلبات.</p>'}
 if(t==='prods'&&$('pl'))$('pl').innerHTML=S.prods.map(p=>`<div class="card"><div class="row"><img class="th n" src="${esc(p.image)}" alt=""><div><b>${esc(p.name)}</b> <span class="mut">${esc(p.category)}</span><br><span class="gold">${Object.entries(p.prices||{}).map(([k,v])=>k+': '+money(v)).join(' · ')}</span></div><div class="row n"><span>نفدت</span><button class="sw ${p.soldOut?'on':''}" data-id="${p.id}" data-f="soldOut" onclick="tog(this)" aria-label="نفدت الكمية"></button><span>مخفي</span><button class="sw ${p.hidden?'on':''}" data-id="${p.id}" data-f="hidden" onclick="tog(this)" aria-label="إخفاء"></button></div><div class="row n"><button class="btn s" data-id="${p.id}" onclick="S.edit=+this.dataset.id;view();scrollTo(0,0)">تعديل</button><button class="btn s r" data-id="${p.id}" onclick="delProd(+this.dataset.id)">حذف</button></div></div></div>`).join('')||'<p class="mut">لا توجد عطور بعد. لو أول مرة، افتح <a href="index.html#admin">index.html#admin</a> واضغط "رفع الكتالوج للسحابة" مرة واحدة.</p>';
 if(t==='cpn'&&$('cl'))$('cl').innerHTML=S.cpn.map(c=>`<div class="card sp"><div><b class="gold">${esc(c.code)}</b> — ${c.type==='fixed'?money(c.value)+' ج.م':c.value+'%'} ${c.showInBar?'· في الشريط':''}</div><div class="row n"><button class="sw ${c.active!==false?'on':''}" data-id="${esc(c._id)}" onclick="cpnTog(this)" aria-label="تفعيل"></button><button class="btn s r" data-id="${esc(c._id)}" onclick="db.collection('coupons').doc(this.dataset.id).delete()">حذف</button></div></div>`).join('')||'<p class="mut">لا توجد كوبونات.</p>';
 if(t==='rev'&&$('rl'))$('rl').innerHTML=S.rev.slice().sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.ts-a.ts).map(r=>{const p=S.prods.find(x=>String(x.id)===String(r.productId));return`<div class="card" style="${r.status==='pending'?'border-color:#f59e0b':''}"><div class="sp"><b>${esc(r.name)}</b><span class="gold">${'★'.repeat(r.stars||0)}</span></div><div class="mut">على: ${esc(p?p.name:r.productId)}</div><div>${esc(r.text)}</div><div class="row" style="margin-top:.4rem">${r.status==='pending'?`<button class="btn s" data-id="${esc(r._id)}" onclick="db.collection('reviews').doc(this.dataset.id).update({status:'approved'})">اعتماد ونشر</button>`:'<span class="mut">منشور ✓</span>'}<button class="btn s r" data-id="${esc(r._id)}" onclick="db.collection('reviews').doc(this.dataset.id).delete()">حذف</button></div></div>`}).join('')||'<p class="mut">لا توجد تقييمات.</p>'}
function warn(o){try{const p=o.payment||{};let sum=0;const bad=[];(o.items||[]).forEach(i=>{const q=Number(i.quantity)||0,pr=Number(i.price)||0;sum+=q*pr;const c=S.prods.find(x=>String(x.id)===String(i.id)),cp=c&&c.prices&&c.prices[i.size];if(c&&cp!=null&&Number(cp)!==pr)bad.push(esc(i.name)+' ('+esc(i.size)+')')});const diff=Number(p.total)-(sum-(Number(p.discount)||0)+(Number(p.shippingCost)||0)),m=[];if(diff!==0&&diff!==50)m.push('الإجمالي لا يطابق البنود (فرق '+money(diff)+' ج.م)');if(bad.length)m.push('سعر مختلف عن الكتالوج الحالي: '+bad.join('، '));return m.length?'<div class="warn">⚠ راجع الطلب قبل التجهيز: '+m.join(' — ')+'</div>':''}catch(e){return''}}
async function setSt(id,i){try{await db.collection('orders').doc(id).update({status:ST[i]});toast('تم تحديث الحالة');const u=S.gen.sheetsUrl,k=localStorage.getItem('sh_key');if(u&&k)fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'status',orderId:id,status:ST[i],key:k})}).catch(()=>{})}catch(e){toast('تعذّر التحديث: '+e.code)}}
async function tog(b){const p=S.prods.find(x=>x.id===+b.dataset.id);if(p)try{await db.collection('perfumes').doc(String(p.id)).update({[b.dataset.f]:!p[b.dataset.f]})}catch(e){toast(e.code)}}
async function delProd(id){if(confirm('حذف العطر نهائيًا؟'))try{await db.collection('perfumes').doc(String(id)).delete()}catch(e){toast(e.code)}}
async function saveProd(){const v=i=>$(i).value.trim(),n=x=>Number(x)||0,pr={};[['30','30ml'],['50','50ml'],['100','100ml']].forEach(a=>{if(n(v('pf-p'+a[0]))>0)pr[a[1]]=n(v('pf-p'+a[0]))});
 if(!v('pf-name')||!Object.keys(pr).length)return toast('اكتب الاسم وسعر واحد على الأقل');const img=v('pf-img');if(img&&!/^https:\/\//.test(img)&&!/^[\w./-]+$/.test(img))return toast('رابط الصورة لازم يبدأ بـ https://');
 const old=S.edit?S.prods.find(x=>x.id===S.edit):null,id=old?old.id:Math.max(0,...S.prods.map(x=>x.id))+1;
 const o=Object.assign({rating:5,reviewsCount:0,pyramid:{top:'',heart:'',base:''},traits:{occasion:'daily',season:'all',notes:'fresh'}},old||{},{id,name:v('pf-name'),category:v('pf-cat'),shortDesc:v('pf-desc'),scent:v('pf-scent'),image:img,prices:pr,basePrice:pr['50ml']||Object.values(pr)[0],tag:v('pf-tag'),isBestseller:$('pf-best').checked,soldOut:$('pf-out').checked,hidden:old?!!old.hidden:false});
 try{await db.collection('perfumes').doc(String(id)).set(o);S.edit=null;toast('تم حفظ العطر');view()}catch(e){toast('تعذّر الحفظ: '+e.code)}}
async function saveCpn(){const code=$('cf-code').value.trim().toUpperCase().replace(/[\/\s]/g,''),val=Number($('cf-val').value),type=$('cf-type').value;if(!code||!(val>0))return toast('اكتب الكود والقيمة');if(type==='percent'&&val>100)return toast('النسبة لا تزيد عن 100');
 try{await db.collection('coupons').doc(await shHash(code)).set({code,type,value:val,active:$('cf-on').checked,showInBar:$('cf-bar').checked});$('cf-code').value='';toast('تم حفظ الكود')}catch(e){toast('تعذّر الحفظ: '+e.code)}}
function cpnTog(b){const c=S.cpn.find(x=>x._id===b.dataset.id);if(c)db.collection('coupons').doc(c._id).update({active:c.active===false})}
async function saveSet(){try{await db.doc('settings/announcement').set({enabled:$('an-on').checked,text:$('an-text').value.trim(),color:$('an-color').value});await db.doc('settings/general').set({sheetsUrl:$('an-sheet').value.trim()},{merge:true});localStorage.setItem('sh_key',$('an-key').value.trim());toast('تم الحفظ')}catch(e){toast('تعذّر الحفظ: '+e.code)}}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(c=>{let s=String(c==null?'':c);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n')}
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function exp(k){if(k==='o')dl('shaden-orders.csv',csv([['رقم الأوردر','التاريخ','الاسم','الهاتف','هاتف إضافي','المحافظة','العنوان','المنتجات','ملاحظات','الدفع','الإجمالي','الحالة']].concat(S.orders.map(o=>{const c=o.customer||{},p=o.payment||{};return[o.orderId,o.timestamp,c.name,c.phone,c.altPhone,c.governorate,c.address,(o.items||[]).map(i=>i.name+' ['+i.size+'] x'+i.quantity).join(' | '),o.notes,PAY[p.method]||p.method,p.total,LEG[o.status]||o.status]}))));
 else{const m={};S.orders.forEach(o=>{const c=o.customer||{};if(!c.phone)return;const x=m[c.phone]||(m[c.phone]={n:c.name,p:c.phone,a:c.altPhone,g:c.governorate,ad:c.address,k:0,t:0});x.k++;x.t+=Number(o.payment&&o.payment.total)||0});dl('shaden-customers.csv',csv([['الاسم','الهاتف','هاتف إضافي','المحافظة','العنوان','عدد الطلبات','إجمالي المشتريات']].concat(Object.values(m).map(x=>[x.n,x.p,x.a,x.g,x.ad,x.k,x.t]))))}}
