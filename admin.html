  if(fac){for(const d of ['settings/shipping','settings/policies','settings/announcement','settings/banner'])try{await db.doc(d).delete()}catch(e){}try{await db.doc('settings/general').set({reviewsSeeded:true,sheetsUrl:firebase.firestore.FieldValue.delete()},{merge:true})}catch(e){}}
  m.textContent='تم: '+D.map(x=>x[1]+' '+x[0]).join('، ');toast('تم الحذف');setTimeout(()=>$('rsm').classList.remove('on'),1400)
 }catch(e){m.textContent='تعذّر الحذف: '+(e.code||e.message)}
}
/* ----- units for product sizes ----- */
const UNITS=[['ml','مللي'],['جرام','جرام'],['كجم','كجم'],['لتر','لتر'],['قطعة','قطعة'],['تولة','تولة'],['عبوة','عبوة'],['علبة','علبة'],['','بدون وحدة']];
function szKey(a,un){a=String(a||'').trim();if(un==='ml')return a?(/^\d+(\.\d+)?$/.test(a)?a+'ml':a+' مل'):'';return(a+' '+un).trim()}
function szSplit(u){u=String(u||'').trim();let m=u.match(/^(\d+(?:\.\d+)?)\s*(ml|مل|مللي)$/i);if(m)return[m[1],'ml'];m=u.match(/^(\d+(?:\.\d+)?)?\s*(جرام|جم|كجم|لتر|قطعة|تولة|عبوة|علبة)$/);if(m)return[m[1]||'',m[2]==='جم'?'جرام':m[2]];return[u,'']}
/* ----- customer accounts: disable / delete ----- */
S.blk={};
const _crmView=crmView;crmView=function(){return _crmView()+'<div id="accl"></div>'};
const _crmFill=crmFill;crmFill=function(){_crmFill();accFill()};
function accFill(){const b=$('accl');if(!b)return;const q=(S.crmQ||'').trim().toLowerCase(),us=S.users||[],L=us.filter(u=>!q||[u.name,u.phone,u.email,u.uid].join(' ').toLowerCase().includes(q)),gone=Object.keys(S.blk).filter(k=>!us.some(u=>u.uid===k));
 const row=(uid,name,sub,bl)=>`<div class="card"><div class="sp"><b>${esc(name||'بدون اسم')}</b>${bl?`<span class="nbadge" style="background:#f43f5e;color:#fff">${bl.reason==='deleted'?'محذوف':'معطّل'}</span>`:''}</div><div class="mut" style="font-size:.85rem">${esc(sub)} <span style="opacity:.6">${esc(uid.slice(0,8))}…</span></div><div class="row n" style="margin-top:.4rem">${bl&&bl.reason==='deleted'?`<button class="btn s g" data-u="${esc(uid)}" onclick="accUnblock(this.dataset.u)">السماح بالتسجيل من جديد</button>`:`<button class="btn s ${bl?'':'g'}" data-u="${esc(uid)}" onclick="accToggle(this.dataset.u)">${bl?'✔ تفعيل الحساب':'⏸ تعطيل الحساب'}</button><button class="btn s r" data-u="${esc(uid)}" onclick="accDelete(this.dataset.u)">🗑 حذف الحساب</button>`}</div></div>`;
 b.innerHTML=`<div class="card"><b class="gold">👤 حسابات العملاء المسجّلين (${L.length})</b><p class="mut" style="font-size:.85rem">التعطيل: العميل بيتسجل خروجه فورًا ومش هيقدر يدخل (وتقدر ترجّعه). الحذف: بيتمسح ملفه من Firebase فورًا ويتسجل خروجه.</p></div>`+L.map(u=>row(u.uid,u.name,[u.phone,u.email].filter(Boolean).join(' · ')||'—',S.blk[u.uid])).join('')+gone.map(k=>row(k,S.blk[k].name,'حساب محذوف',S.blk[k])).join('')||'<p class="mut">لا توجد حسابات مسجّلة.</p>'}
async function accToggle(uid){const bl=S.blk[uid],u=(S.users||[]).find(x=>x.uid===uid)||{};try{if(bl){await db.collection('blocked').doc(uid).delete();toast('تم تفعيل الحساب')}else{if(!(await cfm('تعطيل حساب «'+(u.name||uid)+'»؟ هيتسجل خروجه فورًا ومش هيقدر يدخل لحد ما تفعّله.',{danger:false,ok:'تعطيل',title:'تعطيل الحساب'})))return;await db.collection('blocked').doc(uid).set({reason:'disabled',name:u.name||'',ts:Date.now()});toast('تم تعطيل الحساب')}}catch(e){toast('تعذّر: '+e.code)}}
async function accUnblock(uid){try{await db.collection('blocked').doc(uid).delete();toast('اتفتح التسجيل لهذا الحساب')}catch(e){toast('تعذّر: '+e.code)}}
async function accDelete(uid){const u=(S.users||[]).find(x=>x.uid===uid)||{};
 if(!(await cfm('حذف حساب «'+(u.name||uid)+'» نهائيًا؟ هيتمسح ملفه من Firebase فورًا ويتسجل خروجه.',{title:'حذف حساب عميل',ok:'احذف الحساب'})))return;
 const os=(S.allOrders||[]).filter(o=>o.userId===uid),rs=(S.rev||[]).filter(r=>r.userId===uid);let wipeAll=false;
 if(os.length||rs.length)wipeAll=await cfm('الحساب ده عنده '+os.length+' طلب و'+rs.length+' تقييم.\nتحب نمسحهم كمان؟ (إلغاء = الطلبات والتقييمات تفضل محفوظة)',{title:'بيانات الحساب',ok:'امسحهم كمان'});
 try{const b=db.batch();b.delete(db.collection('users').doc(uid));b.set(db.collection('blocked').doc(uid),{reason:'deleted',name:u.name||'',ts:Date.now()});if(wipeAll){os.forEach(o=>b.delete(db.collection('orders').doc(String(o.orderId))));rs.forEach(r=>b.delete(db.collection('reviews').doc(r._id)))}await b.commit();toast('تم حذف الحساب')}catch(e){toast('تعذّر: '+e.code)}}
const _start2=start;start=function(){_start2();sub(db.collection('blocked'),s=>{S.blk={};s.docs.forEach(d=>S.blk[d.id]=d.data());if(S.tab==='crm')crmFill()})};
</script>
