.dch{display:flex;gap:.4rem;flex-wrap:wrap}.dchip{background:#ffffff1f;color:#fff;border:1px solid #ffffff4d;border-radius:99px;padding:.25rem .9rem;font-size:.85rem}.dchip.on{background:#fff;color:#2e1065;font-weight:700}

.drow{padding:.25rem .5rem;border-radius:8px;margin:.15rem 0;font-size:.9rem}.drow.ok{background:#10b9811a}.drow.bad{background:#f43f5e1f}.drow.ok b{color:#6ee7b7}.drow.bad b{color:#fda4af}

const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};

const TABS=[['orders','الطلبات'],['cat','الأقسام والمنتجات'],['fin','الإحصائيات'],['crm','دليل العملاء'],['ship','الشحن والمحافظات'],['pol','التحويل والسياسات'],['bun','العروض والبكجات'],['cpn','الكوبونات'],['rev','التقييمات'],['ret','المرتجعات'],['set','الإعلان والإعدادات'],['tools','أدوات المنظومة']],cats=()=>S.cats.length?S.cats:DEFCAT;
async function shHash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('shaden:'+String(s).trim().toUpperCase()));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function login(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{if(e.code==='auth/popup-blocked')auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());else msg('تعذّر الدخول: '+e.code)})}
function msg(t){const g=$('gmsg');g.textContent=t;g.style.display='block'}
auth.onAuthStateChanged(u=>{S.subs.forEach(f=>f());S.subs=[];if(u&&u.email===ADMIN&&u.emailVerified){$('gate').style.display='none';$('app').style.display='block';start()}else{$('app').style.display='none';$('gate').style.display='grid';if(u){msg('هذا الحساب غير مصرّح له بالدخول.');auth.signOut()}}});
function sub(q,f){S.subs.push(q.onSnapshot(f,e=>toast('خطأ في القراءة: '+e.code)))}
function start(){
 sub(db.collection('orders'),s=>{if(!S.first)s.docChanges().forEach(c=>{if(c.type==='added')alertNew(c.doc.data())});S.first=false;S.orders=s.docs.map(d=>d.data());nav();abar();fill()});
 sub(db.collection('perfumes'),s=>{S.prods=s.docs.map(d=>d.data()).sort((a,b)=>a.id-b.id);fill()});
 sub(db.collection('coupons'),s=>{S.cpn=s.docs.map(d=>Object.assign({code:d.id},d.data(),{_id:d.id}));fill()});
 sub(db.collection('reviews'),s=>{if(S._revLoaded)s.docChanges().forEach(c=>{if(c.type==='added'&&c.doc.data().status==='pending')alertRev(c.doc.data())});S._revLoaded=true;S.rev=s.docs.map(d=>Object.assign(d.data(),{_id:d.id}));nav();fill();maybeSeed()});
 sub(db.collection('users'),s=>{S.users=s.docs.map(d=>Object.assign({uid:d.id},d.data()));if(S.tab==='crm')crmFill()});
 sub(db.collection('customers'),s=>{S.cust=s.docs.map(d=>Object.assign({_id:d.id},d.data()));if(S.tab==='crm')crmFill()});
 sub(db.doc('settings/announcement'),d=>{S.ann=d.exists?d.data():{}});
 sub(db.doc('settings/general'),d=>{S.gen=d.exists?d.data():{};S._genLoaded=true;maybeSeed()});
 sub(db.doc('settings/shipping'),d=>{S.ship=d.exists&&d.data().list||[];if(S.tab==='ship'&&!S.dirty){S.shipEdit=null;view()}});
 sub(db.doc('settings/policies'),d=>{S.pol=d.exists?d.data():{};if(S.tab==='pol'&&!S.dirty)view()});
 sub(db.doc('settings/categories'),d=>{S.cats=d.exists&&d.data().list||[];if(S.tab==='cat')catFill()});
 sub(db.collection('returns'),s=>{S.ret=s.docs.map(d=>d.data());fill()});
 sub(db.collection('bundles'),s=>{S.bun=s.docs.map(d=>Object.assign({_id:d.id},d.data()));fill()});
 nav();view();
}
var nav=function(){const p=S.rev.filter(r=>r.status==='pending').length;$('nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';S.dirty=false;S.shipEdit=null;S.catEdit=null;nav();view()">${t[1]}${t[0]==='rev'&&p?`<b>${p}</b>`:''}</button>`).join('')}
function view(){const v=$('v'),t=S.tab;

 if(t==='ret'){v.innerHTML=`<div class="card"><b class="gold">تسجيل مرتجع / تالف</b><select id="rt-order" onchange="S.rf=this.value;rtItems()"><option value="">اختر الأوردر</option>${S.orders.slice().sort((a,b)=>String(b.orderId).localeCompare(String(a.orderId))).map(o=>`<option value="${esc(o.orderId)}" ${S.rf===o.orderId?'selected':''}>#${esc(o.orderId)} — ${esc((o.customer||{}).name)}</option>`).join('')}</select><div id="rt-items"></div><div class="row"><select id="rt-act"><option value="restock">إرجاع الكمية للمخزون</option><option value="damaged">تالف (لا يعود للمخزون)</option></select><input class="field" id="rt-amt" type="number" placeholder="مبلغ الاسترداد (ج.م)"></div><input class="field" id="rt-why" placeholder="سبب المرتجع"><button class="btn" onclick="saveRet()">تسجيل</button></div><div id="rtl"></div>`;rtItems()}
 if(t==='cpn')v.innerHTML=`<div class="card"><b class="gold">كود خصم جديد</b><div class="row"><input class="field" id="cf-code" placeholder="الكود (مثال SHADEN10)"><select id="cf-type"><option value="percent">نسبة %</option><option value="fixed">مبلغ ثابت</option></select><input class="field" id="cf-val" type="number" placeholder="القيمة"></div><div class="row"><label><input type="checkbox" id="cf-on" checked> مفعّل</label><label><input type="checkbox" id="cf-bar"> يظهر في شريط الإعلان</label></div><button class="btn" onclick="saveCpn()">حفظ الكود</button></div><div id="cl"></div>`;
 if(t==='rev')v.innerHTML='<div id="rl"></div>';
 if(t==='set'){const a=S.ann,g=S.gen;v.innerHTML=`<div class="card"><b class="gold">شريط الإعلان</b><label class="row"><input type="checkbox" id="an-on" ${a.enabled?'checked':''} style="flex:none"> تفعيل الشريط</label><input class="field" id="an-text" placeholder="نص الإعلان" value="${esc(a.text)}"><label>اللون <input type="color" id="an-color" value="${esc(a.color||'#4F46E5')}"></label></div><div class="card"><b class="gold">ربط Google Sheets</b><input class="field" id="an-sheet" placeholder="رابط Web App (ينتهي بـ /exec)" value="${esc(g.sheetsUrl)}"><input class="field" id="an-key" type="password" placeholder="مفتاح الأدمن ADMIN_KEY (بيتحفظ على جهازك فقط)" value="${esc(localStorage.getItem('sh_key')||'')}"><p class="mut" style="font-size:.8rem">نفس القيمة اللي حطيتها في Script properties باسم ADMIN_KEY. بيُستخدم لتحديث الحالة في الشيت.</p></div><button class="btn" onclick="saveSet()">حفظ الإعدادات</button>`}

function finCalc(L){L=L||S.orders;const R={all:0,collected:0,pending:0,waiting:0,returns:0,cancelled:0,cost:0,pay:{cod:0,vodafone:0,instapay:0},n:0};
 L.forEach(o=>{const st=stN(o),t=Number(o.payment&&o.payment.total)||0,r=Number(o.returnedAmount)||0,net=netOf(o);R.returns+=r;if(st===ST[5]){R.cancelled+=t;return}R.all+=net;R.n++;
  if(st===ST[3]||st===ST[4]){R.collected+=net;const m=(o.payment&&o.payment.method)||'cod';R.pay[m]=(R.pay[m]||0)+net;
   (o.items||[]).forEach(it=>{(it.bundleItems||[{id:it.id,quantity:1}]).forEach(b=>{const p=S.prods.find(x=>String(x.id)===String(b.id));if(p&&typeof p.cost==='number')R.cost+=p.cost*(Number(b.quantity)||1)*(Number(it.quantity)||0)})})}
  else if(st===ST[0])R.waiting+=net;else R.pending+=net});
 return R}

 b.innerHTML=L.map(x=>`<div class="card"><div class="sp"><b class="gold">${esc(x.name)}</b><span class="mut">${x.orders.length} طلب · إنفاق: <b class="gold">${money(x.spent)} ج.م</b></span></div><div class="row" style="margin:.3rem 0">${ph(x.phone)}${[...x.alts].map(ph).join('')}</div><div class="mut" style="font-size:.85rem">${[...x.addrs].map(esc).join('<br>')}</div><button class="btn s g" style="margin-top:.4rem" onclick="S.crmOpen['${x.k}']=!S.crmOpen['${x.k}'];crmFill()">${S.crmOpen[x.k]?'إخفاء المشتريات':'سجل المشتريات'}</button>${S.crmOpen[x.k]?x.orders.slice().sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).map(o=>`<div class="mut" style="border-top:1px dashed var(--ln);margin-top:.4rem;padding-top:.3rem"><b class="gold">#${esc(o.orderId)}</b> · ${esc(new Date(o.timestamp).toLocaleDateString('ar-EG'))} · ${money(o.payment&&o.payment.total)} ج.م · ${esc(stN(o))}<br>${(o.items||[]).map(i=>esc(i.name)+' ('+esc(i.size)+') ×'+(Number(i.quantity)||0)).join('، ')}</div>`).join(''):''}</div>`).join('')||'<p class="mut">لا يوجد عملاء.</p>'}

/* ---- bundles & offers ---- */
var bunView=function(){const b=S.bunEdit?S.bun.find(x=>x._id===S.bunEdit)||{}:{};return `<div class="card"><b class="gold">${S.bunEdit?'تعديل بكج':'بكج / عرض جديد'}</b><div class="row"><input class="field" id="bf-name" placeholder="اسم البكج" value="${esc(b.name)}"><input class="field" id="bf-price" type="number" min="1" placeholder="سعر البكج (ج.م)" value="${esc(b.price)}"></div><input class="field" id="bf-img" placeholder="رابط صورة البكج (https://...)" value="${esc(b.image)}"><input class="field" id="bf-desc" placeholder="وصف مختصر" value="${esc(b.description)}"><input class="field" id="bf-gift" placeholder="هدية مجانية مرفقة (اختياري) مثال: بادي لوشن 100 مل" value="${esc(b.gift)}"><label class="mut">محتويات البكج (منتجات من أي قسم)</label><div id="bitems"></div><div class="row"><button class="btn g s" onclick="S.bunItems.push({id:(S.prods[0]||{}).id,size:Object.keys((S.prods[0]||{}).prices||{})[0]||'',qty:1});bunRows()">+ إضافة منتج للبكج</button></div><div class="row"><label><input type="checkbox" id="bf-on" ${b.active===false?'':'checked'}> ظاهر في المتجر</label></div><div class="row"><button class="btn" onclick="saveBun()">حفظ البكج</button>${S.bunEdit?'<button class="btn g" onclick="S.bunEdit=null;S.bunItems=[];view()">إلغاء</button>':''}</div></div><div id="bunl"></div>`}
function bunRows(){const el=$('bitems');if(!el)return;el.innerHTML=S.bunItems.map((it,i)=>{const p=S.prods.find(x=>String(x.id)===String(it.id))||{};return `<div class="row"><select onchange="bunSet(${i},'id',this.value)">${S.prods.map(x=>`<option value="${x.id}" ${String(x.id)===String(it.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select onchange="bunSet(${i},'size',this.value)">${Object.keys(p.prices||{}).map(k=>`<option ${k===it.size?'selected':''}>${esc(k)}</option>`).join('')}</select><input class="field n" style="max-width:80px" type="number" min="1" value="${it.qty||1}" oninput="S.bunItems[${i}].qty=+this.value"><button class="btn s r n" onclick="S.bunItems.splice(${i},1);bunRows()">حذف</button></div>`}).join('')||'<p class="mut">أضف منتج واحد على الأقل.</p>'}
function bunSet(i,k,v){S.bunItems[i][k]=k==='id'?Number(v):v;if(k==='id'){const p=S.prods.find(x=>String(x.id)===String(v));S.bunItems[i].size=Object.keys((p&&p.prices)||{})[0]||''}bunRows()}
function bunFill(){const l=$('bunl');if(!l)return;l.innerHTML=S.bun.map(b=>{const reg=(b.items||[]).reduce((a,it)=>{const p=S.prods.find(x=>String(x.id)===String(it.id));return a+((p&&p.prices&&Number(p.prices[it.size]))||0)*(it.qty||1)},0);return `<div class="card"><div class="row"><img class="th n" src="${esc(b.image)}" alt=""><div><b>${esc(b.name)}</b> <span class="gold">${money(b.price)} ج.م</span> <span class="mut">(بدل ${money(reg)})</span>${b.gift?'<br>🎁 '+esc(b.gift):''}<br><span class="mut">${(b.items||[]).map(it=>{const p=S.prods.find(x=>String(x.id)===String(it.id));return esc(p?p.name:it.id)+' ('+esc(it.size)+') ×'+(it.qty||1)}).join(' + ')}</span></div><div class="row n"><span>ظاهر</span><button class="sw ${b.active!==false?'on':''}" data-id="${esc(b._id)}" onclick="bunTog(this.dataset.id)" aria-label="ظهور"></button><button class="btn s" data-id="${esc(b._id)}" onclick="bunEditGo(this.dataset.id)">تعديل</button><button class="btn s r" data-id="${esc(b._id)}" onclick="bunDel(this.dataset.id)">حذف</button></div></div></div>`}).join('')||'<p class="mut">لا توجد بكجات.</p>'}
var bunEditGo=function(id){const b=S.bun.find(x=>x._id===id);if(!b)return;S.bunEdit=id;S.bunItems=(b.items||[]).map(x=>({id:x.id,size:x.size,qty:x.qty||1}));view();scrollTo(0,0)}
async function bunTog(id){const b=S.bun.find(x=>x._id===id);if(b)try{await db.collection('bundles').doc(id).update({active:b.active===false})}catch(e){toast(e.code)}}
async function bunDel(id){if(confirm('حذف البكج؟'))try{await db.collection('bundles').doc(id).delete()}catch(e){toast(e.code)}}
var saveBun=async function(){const name=$('bf-name').value.trim(),price=Number($('bf-price').value);if(!name||!(price>0)||!S.bunItems.length)return toast('اكتب الاسم والسعر وأضف منتج واحد على الأقل');const img=$('bf-img').value.trim();if(img&&!/^https:\/\//.test(img))return toast('رابط الصورة لازم يبدأ بـ https://');
 const old=S.bunEdit?S.bun.find(x=>x._id===S.bunEdit):null,id=old?old._id:'B'+Date.now();
 try{await db.collection('bundles').doc(id).set({id,name,image:img,price,description:$('bf-desc').value.trim(),gift:$('bf-gift').value.trim(),active:$('bf-on').checked,items:S.bunItems.map(x=>({id:Number(x.id),size:x.size,qty:Math.max(1,Math.floor(x.qty||1))})),ts:Date.now()});S.bunEdit=null;S.bunItems=[];toast('تم حفظ البكج');view()}catch(e){toast('تعذّر الحفظ: '+e.code)}}

/* ---- tools: seed + production reset ---- */
var toolsView=function(){return `<div class="card"><b class="gold">رفع الكتالوج الافتراضي</b><p class="mut">لو لسه مفيش منتجات في السحابة، ارفع العطور الافتراضية مرة واحدة وبعدها عدّلها من تبويب «العطور».</p><button class="btn" onclick="seedProds()">رفع الكتالوج الافتراضي</button></div>
 <div class="card" style="border-color:#f43f5e"><b style="color:#fda4af">تصفير المنظومة قبل التسليم</b><p class="mut">بيمسح كل الطلبات (والعملاء والمبيعات والميزانية المشتقة منها) والمرتجعات، وبيصفّر عداد الفواتير ليبدأ من SHD-001. بيبقى على حاله: الأقسام والمنتجات وأسعارها ومحافظات الشحن والسياسات والكوبونات والبكجات.</p><label><input type="checkbox" id="rs-rev" checked> مسح التقييمات التجريبية كمان</label><br><label><input type="checkbox" id="rs-cu" checked> مسح سجلات دليل العملاء اليدوية</label><input class="field" id="rs-word" placeholder="اكتب كلمة: تصفير للتأكيد"><button class="btn r" onclick="resetAll()">تصفير الآن</button><p id="rs-msg" class="mut"></p></div>`}
async function seedProds(){if(S.prods.length&&!confirm('فيه منتجات موجودة، الرفع هيستبدل اللي بنفس الرقم. متأكد؟'))return;try{const b=db.batch();SEED.forEach((p,i)=>b.set(db.collection('perfumes').doc(String(p.id)),Object.assign({},p,{order:i})));await b.commit();toast('تم رفع الكتالوج الافتراضي')}catch(e){toast('تعذّر الرفع: '+e.code)}}
async function wipe(col){let n=0;for(;;){const s=await db.collection(col).limit(400).get();if(s.empty)break;const b=db.batch();s.docs.forEach(d=>b.delete(d.ref));await b.commit();n+=s.size}return n}
async function resetAll(){if($('rs-word').value.trim()!=='تصفير')return toast('اكتب كلمة: تصفير');if(!confirm('تأكيد نهائي: حذف كل الطلبات والمرتجعات وتصفير الفواتير. لا يمكن التراجع.'))return;const m=$('rs-msg');try{m.textContent='جاري التصفير...';const a=await wipe('orders'),r=await wipe('returns');let v=0;if($('rs-rev').checked){v=await wipe('reviews');try{await db.doc('settings/general').set({reviewsSeeded:true},{merge:true})}catch(e){}}if($('rs-cu').checked)await wipe('customers');try{await db.doc('counters/orders').delete()}catch(e){}localStorage.setItem('sh_cel','0');m.textContent=`تم: ${a} طلب، ${r} مرتجع، ${v} تقييم. الفاتورة القادمة SHD-001.`;toast('تم تصفير المنظومة')}catch(e){m.textContent='تعذّر التصفير: '+e.code}}

function fillX(t){finCheck();if(t==='cat')catFill();if(t==='fin'){const b=$('fins');if(b){b.innerHTML=finStats();finFill()}}if(t==='crm')crmFill();if(t==='bun'){bunFill()}}

Object.assign(S,{csel:'all',pq:'',pd:null,od:null,users:[],cust:[],cq:'',_revLoaded:false,_genLoaded:false});
const PHI="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E1B4B"/><stop offset="1" stop-color="#4C1D95"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><g fill="none" stroke="#B4C1F5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><rect x="168" y="80" width="64" height="38" rx="8"/><path d="M186 118v22M214 118v22"/><path d="M150 152h100a18 18 0 0 1 18 18v140a28 28 0 0 1-28 28H160a28 28 0 0 1-28-28V170a18 18 0 0 1 18-18z"/><path d="M168 222c14 14 50 14 64 0"/></g></svg>');
const imgOf=p=>p&&p.image?p.image:PHI;
const sizeLbl=k=>{const m=String(k).match(/^(\d+(?:\.\d+)?)\s*ml$/i);return m?m[1]+' مل':String(k)};
const catNm=k=>{const c=cats().find(x=>x.key===k);return c?c.name:null};
const pmClose=()=>{$('pm').classList.remove('on');S.pd=null},cmClose=()=>$('cm').classList.remove('on'),oeClose=()=>{$('oe').classList.remove('on');S.od=null};

/* ---- catalog: categories + products in one place ---- */
function catView(){return `<div class="row"><button class="btn n" onclick="pmOpen()">+ منتج جديد</button><button class="btn g n" onclick="cmOpen(true)">+ قسم جديد</button><button class="btn g n" onclick="cmOpen(false)">إدارة الأقسام</button><input class="field" placeholder="ابحث عن منتج بالاسم" value="${esc(S.pq)}" oninput="S.pq=this.value;catFill()"></div><div id="ccats" class="chips"></div><div id="cprods"></div>`}
function catFill(){const ch=$('ccats'),pl=$('cprods');if(!ch||!pl)return;const L=cats(),has=p=>L.some(c=>c.key===p.category),inCat=(p,k)=>k==='all'||(k==='_none'?!has(p):(p.category===k||(p.cats||[]).includes(k)));
 const none=S.prods.filter(p=>!has(p)).length;ch.innerHTML=[['all','الكل']].concat(L.map(c=>[c.key,c.name])).concat(none?[['_none','بدون قسم']]:[]).map(([k,n])=>`<button class="chip ${S.csel===k?'on':''}" data-k="${esc(k)}" onclick="S.csel=this.dataset.k;catFill()">${esc(n)} <b>${S.prods.filter(p=>inCat(p,k)).length}</b></button>`).join('');
 const q=S.pq.trim().toLowerCase(),list=S.prods.filter(p=>inCat(p,S.csel)&&(!q||String(p.name).toLowerCase().includes(q)));
 pl.innerHTML=(S.prods.length?'':`<div class="card"><b class="gold">الكتالوج فاضي</b><p class="mut">اضغط «رفع الكتالوج الافتراضي» من تبويب أدوات المنظومة، أو ابدأ بإضافة منتج جديد.</p></div>`)+list.map(p=>`<div class="card pcard"><img class="pth" src="${esc(imgOf(p))}" alt=""><div class="pinfo"><div class="sp"><b>${esc(p.name)}</b>${p.isBestseller?'<span class="gold">★ الأكثر طلباً</span>':''}</div><div class="mut">${esc(catNm(p.category)||'بدون قسم')}${(p.cats||[]).map(k=>catNm(k)).filter(Boolean).map(n=>' + '+esc(n)).join('')}</div><div class="gold" style="font-size:.88rem">${Object.entries(p.prices||{}).map(([k,v])=>esc(sizeLbl(k))+': '+money(v)).join(' · ')||'—'}</div><div class="mut" style="font-size:.85rem">${typeof p.stock==='number'?'المخزون: <b>'+p.stock+'</b>':'المخزون غير متتبَّع'}${p.damaged?' · تالف: '+p.damaged:''}</div></div><div class="pact"><label class="tg">نفدت<button class="sw ${p.soldOut?'on':''}" data-id="${p.id}" data-f="soldOut" onclick="tog(this)" aria-label="نفدت الكمية"></button></label><label class="tg">مخفي<button class="sw ${p.hidden?'on':''}" data-id="${p.id}" data-f="hidden" onclick="tog(this)" aria-label="إخفاء"></button></label><div class="row n"><button class="btn s" data-id="${p.id}" onclick="pmOpen(+this.dataset.id)">تعديل</button><button class="btn s g" data-id="${p.id}" onclick="pmDup(+this.dataset.id)">نسخ</button><button class="btn s r" data-id="${p.id}" onclick="delProd(+this.dataset.id)">حذف</button></div></div></div>`).join('')||(S.prods.length?'<p class="mut">لا توجد منتجات في هذا القسم.</p>':'')}
function pmOpen(id){const p=id!=null?S.prods.find(x=>x.id===id):null;S.pd=p?JSON.parse(JSON.stringify(p)):{name:'',category:cats()[0].key,cats:[],shortDesc:'',scent:'',image:'',prices:{},tag:'',traits:{occasion:'daily',season:'all',notes:'fresh'},related:[]};S.pd._id=p?p.id:null;S.pd.sizes=Object.entries(S.pd.prices||{}).map(([u,pr])=>({u,p:pr}));if(!S.pd.sizes.length)S.pd.sizes=[{u:'50ml',p:''}];pmRender();$('pm').classList.add('on')}
function pmDup(id){pmOpen(id);S.pd._id=null;S.pd.name+=' (نسخة)';S.pd.stock=undefined;pmRender()}
function pmSync(){const d=S.pd;if(!d||!$('pf-name'))return;const g=i=>$(i)?$(i).value.trim():'';d.name=g('pf-name');d.category=g('pf-cat');d.shortDesc=g('pf-desc');d.scent=g('pf-scent');d.tag=g('pf-tag');d.stockTxt=g('pf-stock');d.costTxt=g('pf-cost');d.traits={occasion:g('pf-occ'),season:g('pf-sea'),notes:g('pf-not')};d.isBestseller=$('pf-best').checked;d.soldOut=$('pf-out').checked;d.cats=Array.from(document.querySelectorAll('.pf-cats:checked')).map(x=>x.value);d.related=Array.from(document.querySelectorAll('.pf-rel:checked')).map(x=>+x.value);
 d.sizes=Array.from(document.querySelectorAll('.pm-row')).map(r=>({u:r.querySelector('.pm-u').value.trim(),p:r.querySelector('.pm-p').value}));const iu=$('pf-img');if(iu&&!String(d.image||'').startsWith('data:'))d.image=iu.value.trim()}
function pmRender(){const d=S.pd;if(!d)return;const data=String(d.image||'').startsWith('data:'),others=S.prods.filter(x=>x.id!==d._id);
 $('pm-body').innerHTML=`<div class="sp"><b class="gold" style="font-size:1.1rem">${d._id!=null?'تعديل منتج':'منتج جديد'}</b><button class="btn s g" onclick="pmClose()">✕</button></div>
 <div class="row"><input class="field" id="pf-name" placeholder="اسم المنتج" value="${esc(d.name)}"><select id="pf-cat">${cats().map(c=>`<option value="${esc(c.key)}" ${d.category===c.key?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
 <div class="imgbox"><img id="pm-prev" src="${esc(imgOf(d))}" alt=""><div style="flex:1"><label class="mut">صورة المنتج — ارفع صورة أو اكتب رابطها أو اتركها فاضية (هتظهر أيقونة احترافية)</label>${data?'<div class="mut" style="padding:.3rem 0">✔ صورة مرفوعة من جهازك</div>':`<input class="field" id="pf-img" placeholder="رابط الصورة (https://...)" value="${esc(d.image||'')}" oninput="S.pd.image=this.value.trim();$('pm-prev').src=S.pd.image||PHI" onerror="">`}<div class="row"><label class="btn s g n" style="cursor:pointer">📤 رفع صورة<input type="file" accept="image/*" style="display:none" onchange="pmFile(this)"></label><button class="btn s g n" onclick="pmSync();S.pd.image='';pmRender()">إزالة الصورة</button></div></div></div>
 <input class="field" id="pf-desc" placeholder="وصف مختصر بالمصري" value="${esc(d.shortDesc)}"><input class="field" id="pf-scent" placeholder="ريحته وطابعه" value="${esc(d.scent)}">
 <label class="mut">الأحجام والوحدات والأسعار — أضف أي وحدة (مل، تولة، قطعة، 250 جرام، عبوة...) وسعرها</label><datalist id="units">${['30ml','50ml','100ml','تولة','قطعة','100 جرام','250 جرام','عبوة','علبة','بكج'].map(u=>`<option value="${u}">`).join('')}</datalist>
 <div id="pm-sizes">${d.sizes.map((s,i)=>`<div class="row pm-row"><input class="field pm-u" list="units" placeholder="الحجم / الوحدة" value="${esc(s.u)}"><input class="field pm-p n" style="max-width:130px" type="number" min="1" placeholder="السعر ج.م" value="${esc(s.p)}"><button class="btn s r n" onclick="pmSync();S.pd.sizes.splice(${i},1);pmRender()">حذف</button></div>`).join('')}</div><button class="btn s g" onclick="pmSync();S.pd.sizes.push({u:'',p:''});pmRender()">+ إضافة حجم / وحدة</button>
 <div class="row"><input class="field" id="pf-stock" type="number" min="0" placeholder="المخزون (فاضي = غير متتبَّع)" value="${d.stockTxt!==undefined?esc(d.stockTxt):(typeof d.stock==='number'?d.stock:'')}"><input class="field" id="pf-tag" placeholder="وسم (مثال: جديد)" value="${esc(d.tag)}"><input class="field" id="pf-cost" type="number" min="0" placeholder="تكلفة الوحدة (اختياري)" value="${d.costTxt!==undefined?esc(d.costTxt):(typeof d.cost==='number'?d.cost:'')}"></div>
 <label class="mut">يظهر كمان في أقسام (ربط ذكي بدون تكرار المنتج)</label><div class="row">${cats().filter(c=>c.key!==d.category).map(c=>`<label class="tg" style="flex:1 1 140px"><input type="checkbox" class="pf-cats" value="${esc(c.key)}" ${(d.cats||[]).includes(c.key)?'checked':''}> ${esc(c.name)}</label>`).join('')||'<span class="mut">أضف أقسام أكتر</span>'}</div>
 <label class="mut">تصنيف «اعرف عطرك»</label><div class="row"><select id="pf-occ">${[['daily','يومي وللشغل'],['night','خروجات وسهرات'],['formal','مناسبات وأفراح'],['summer','انتعاش صيفي']].map(x=>`<option value="${x[0]}" ${(d.traits||{}).occasion===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><select id="pf-sea">${[['winter','شتوي'],['summer','صيفي'],['all','كل الفصول']].map(x=>`<option value="${x[0]}" ${(d.traits||{}).season===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><select id="pf-not">${[['oud','عود'],['floral','زهري'],['vanilla','فانيلا'],['citrus','حمضيات'],['fresh','منعش']].map(x=>`<option value="${x[0]}" ${(d.traits||{}).notes===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
 <label class="mut">«يكمّل معاه» — منتجات مقترحة تظهر للعميل</label><div class="row" style="max-height:120px;overflow:auto">${others.map(x=>`<label class="tg" style="flex:1 1 200px"><input type="checkbox" class="pf-rel" value="${x.id}" ${(d.related||[]).map(String).includes(String(x.id))?'checked':''}> ${esc(x.name)}</label>`).join('')||'<span class="mut">لا توجد منتجات أخرى</span>'}</div>

function inPeriod(o){const t=new Date(o.timestamp);if(isNaN(t))return false;const f=S.fd;return(!f.y||t.getFullYear()===+f.y)&&(!f.m||t.getMonth()+1===+f.m)&&(!f.d||t.getDate()===+f.d)}

function compressImg(f,cb){if(!f)return;if(!/^image\//.test(f.type))return toast('اختر ملف صورة');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=900,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>380000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}cb(d)};im.onerror=()=>toast('تعذّر قراءة الصورة');im.src=r.result};r.readAsDataURL(f)}

/* ---- tools: delete all products + connection diagnostics ---- */
function toolsView2(){return `<div class="card"><b class="gold">فحص الاتصال والصلاحيات بـ Firebase</b><p class="mut">بيفحص إن بيانات المتجر مربوطة صح: بيقرأ كل مجموعة كأدمن، وبيجرّب كزائر (بدون تسجيل دخول) قراءة الكتالوج والإعدادات وإرسال أوردر تجريبي (بيتمسح فورًا) ويتأكد إن الزائر مش قادر يقرأ الطلبات.</p><button class="btn" onclick="runDiag()">ابدأ الفحص</button><div id="diag" style="margin-top:.6rem"></div></div>
 <div class="card" style="border-color:#f43f5e"><b style="color:#fda4af">حذف كل المنتجات من المتجر</b><p class="mut">بيمسح كل العطور والبكجات من Firestore فيفضل المتجر فاضي لحد ما تضيف منتجاتك. (الأقسام والشحن والسياسات مش بتتمسح.)</p><input class="field" id="dp-word" placeholder="اكتب كلمة: حذف للتأكيد"><button class="btn r" onclick="delAllProds()">حذف كل المنتجات</button></div>`}
const _tv=toolsView;toolsView=function(){return toolsView2()+_tv()};
async function delAllProds(){if($('dp-word').value.trim()!=='حذف')return toast('اكتب كلمة: حذف');if(!confirm('تأكيد نهائي: حذف كل المنتجات والبكجات؟'))return;try{const a=await wipe('perfumes'),b=await wipe('bundles');toast('تم حذف '+a+' منتج و'+b+' بكج')}catch(e){toast('تعذّر: '+e.code)}}
async function runDiag(){const out=$('diag');const rows=[];const R=(ok,t,note)=>{rows.push(`<div class="drow ${ok?'ok':'bad'}"><b>${ok?'✓':'✗'}</b> ${esc(t)}${note?` <span class="mut">— ${esc(note)}</span>`:''}</div>`);out.innerHTML=rows.join('')};out.innerHTML='<p class="mut">جاري الفحص...</p>';
 const A=async(t,f)=>{try{const n=await f();R(true,t,n)}catch(e){R(false,t,e.code||e.message)}};
 R(true,'أنت داخل كأدمن: '+(auth.currentUser||{}).email);
 for(const c of ['perfumes','bundles','orders','reviews','coupons','users','customers','returns'])await A('أدمن يقرأ '+c,async()=>{const s=await db.collection(c).get();return s.size+' مستند'});
 for(const d of ['settings/categories','settings/shipping','settings/policies','settings/announcement','counters/orders'])await A('مستند '+d,async()=>{const s=await db.doc(d).get();return s.exists?'موجود':'غير موجود بعد (بيتعمل أول ما تحفظه)'});
 let g;try{g=firebase.app('guest')}catch(e){g=firebase.initializeApp(firebase.app().options,'guest')}const gd=g.firestore();rows.push('<div class="mut" style="margin:.5rem 0">— من وجهة نظر الزائر (بدون تسجيل دخول) —</div>');
 await A('زائر يقرأ الكتالوج',async()=>{const s=await gd.collection('perfumes').limit(1).get();return s.size+' مستند'});
 for(const d of ['settings/shipping','settings/policies','settings/categories'])await A('زائر يقرأ '+d,async()=>{await gd.doc(d).get();return 'مسموح'});
 await A('زائر يقرأ التقييمات المعتمدة',async()=>{const s=await gd.collection('reviews').where('status','==','approved').get();return s.size+' تقييم'});
 await A('زائر يقرأ العروض',async()=>{await gd.collection('bundles').get();return 'مسموح'});
 const id='TEST-'+Date.now();let created=false;
 try{await gd.collection('orders').doc(id).set({orderId:id,userId:null,timestamp:new Date().toISOString(),customer:{name:'اختبار',phone:'0100000000'},items:[],payment:{total:0},status:'في انتظار تأكيد الطلب'});created=true;R(true,'إرسال أوردر تجريبي (قواعد إنشاء الطلب)','مسموح — الطلبات هتتحفظ')}catch(e){R(false,'إرسال أوردر تجريبي',(e.code||e.message)+' ← انشر قواعد Firestore الأخيرة (ملف firestore.rules)')}
 if(created)try{await db.collection('orders').doc(id).delete()}catch(e){}
 try{await gd.collection('orders').get();R(false,'الزائر ما يقدرش يقرأ الطلبات','الزائر قدر يقرأ الطلبات! القواعد مش محمية')}catch(e){R(true,'الزائر ما يقدرش يقرأ الطلبات','محمي ✓')}
 const bad=rows.some(r=>r.includes('drow bad'));rows.push(`<div class="card" style="margin-top:.6rem">${bad?'<b style="color:#fda4af">فيه نقاط محتاجة تصليح — راجع السطور الحمرا. أغلبها حل واحد: انشر ملف firestore.rules من Firebase Console > Firestore > Rules > Publish.</b>':'<b style="color:#6ee7b7">كل حاجة مربوطة صح ✓ — أي تعديل هنا بيوصل المتجر لحظيًا.</b>'}</div>`);out.innerHTML=rows.join('')}

/* ---- policies: require login ---- */
const _polView=polView;polView=function(){const h=_polView();return h.replace('<label class="mut">حد الشحن المجاني','<label class="mut">حد الشحن المجاني')};

</script></body></html>
